services:
  labelframe-server:
    image: labelframe-server:0.15.4
    container_name: labelframe-server
    restart: unless-stopped
    ports:
      - "53961:53961"
    volumes:
      - labelframe-data:/var/lib/labelframe/server
      - ./logs:/var/lib/labelframe/logs
      # 可选：服务端管理界面插件（迭代 20）——把 web/dist-server 解压到 ./plugins/web-ui 后放进去即生效、移除即无头
      # - ./plugins/web-ui:/var/lib/labelframe/server/plugins/web-ui
    logging:
      driver: "json-file"
      options:
        max-size: "1024M"
        max-file: "1"
    environment:
      - TZ=Asia/Shanghai
      - LABELFRAME_SERVER_LISTEN=http://0.0.0.0:53961
      - LABELFRAME_SERVER_DB=/var/lib/labelframe/server/server.db
      - LABELFRAME_SERVER_TEMPLATES_DB=/var/lib/labelframe/server/templates.db
      - LABELFRAME_SERVER_LOGS_DB=/var/lib/labelframe/server/logs.db
      - LABELFRAME_SERVER_LOG_FILE=/var/lib/labelframe/logs/server.log

volumes:
  labelframe-data: