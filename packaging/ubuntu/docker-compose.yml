services:
  labelframe-server:
        # 默认从 ghcr.io 拉取；本地调试可覆盖：
    #   LABELFRAME_IMAGE=labelframe-server LABELFRAME_VERSION=0.16.0 docker compose up -d
    image: ${LABELFRAME_IMAGE:-ghcr.io/marci-labs/labelframe-server}:${LABELFRAME_VERSION:-latest}
    container_name: labelframe-server
    restart: unless-stopped
    ports:
      - "53961:53961"
    volumes:
      - labelframe-data:/var/lib/labelframe/server
      - ./logs:/var/lib/labelframe/logs
      # 服务端管理界面插件（迭代 20）：把 labelframe-server-webui-<version>.zip 解压到 ./plugins/web-ui
      # （即容器内 /var/lib/labelframe/server/plugins/web-ui），放进去即生效、移除即无头；不启用可注释掉本行
      - ./plugins/web-ui:/var/lib/labelframe/server/plugins/web-ui
      # 客户端安装包目录（迭代 22 §2.3）：宿主机 ./client-packages 即容器内 /var/lib/labelframe/server/client-packages——
      # 管理员把客户端 MSI 放进去（或经管理界面「客户端下载」上传），客户端设置页即可从服务端下载更新；不启用可注释掉本行
      - ./client-packages:/var/lib/labelframe/server/client-packages
    logging:
      driver: "json-file"
      options:
        max-size: "1024M"
        max-file: "1"
    environment:
      - TZ=Asia/Shanghai
      - LABELFRAME_SERVER_LISTEN=http://0.0.0.0:53961
      - LABELFRAME_SERVER_DB=/var/lib/labelframe/server/server.db
      - LABELFRAME_SERVER_TEMPLATES_DB=/var/lib/labelframe/server/templates.db
      - LABELFRAME_SERVER_LOGS_DB=/var/lib/labelframe/server/logs.db
      - LABELFRAME_SERVER_LOG_FILE=/var/lib/labelframe/logs/server.log

volumes:
  labelframe-data: