<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabelFrame Web 设计器原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; color: #222; height: 100vh; display: flex; flex-direction: column; background: #f4f6f8; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #d8dee6; flex-wrap: wrap; }
  header label { display: inline-flex; align-items: center; gap: 4px; color: #444; }
  header input[type=number] { width: 48px; }
  input, select, button { font: inherit; padding: 4px 6px; border: 1px solid #c4ccd6; border-radius: 4px; background: #fff; }
  button { cursor: pointer; }
  button:hover { background: #eef3f9; }
  button.primary { background: #1668dc; color: #fff; border-color: #1668dc; }
  button.primary:hover { background: #0f57bd; }
  #connStatus { color: #888; }
  #connStatus.on { color: #0a7; font-weight: bold; }
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 210px; background: #fff; border-right: 1px solid #d8dee6; padding: 10px; overflow-y: auto; }
  #right { border-right: none; border-left: 1px solid #d8dee6; width: 260px; }
  aside h3 { font-size: 12px; color: #666; margin: 8px 0 6px; }
  .palette { display: flex; flex-wrap: wrap; gap: 6px; }
  .palette button { width: 62px; height: 30px; }
  .palette button.region { background: #fff4e0; border-color: #d4a75b; }
  #fieldList { list-style: none; font-size: 12px; }
  #fieldList li { padding: 3px 0; border-bottom: 1px dashed #e3e8ee; font-family: Consolas, monospace; }
  #center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #canvasWrap { flex: 1; overflow: auto; padding: 8px; }
  #stageBox { display: inline-block; background: #fff; border: 1px solid #9aa6b4; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  #hRuler, #vRuler { background: #f7f8fa; border-color: #d8dee6; position: relative; overflow: hidden; }
  #hRuler { height: 20px; border-bottom: 1px solid #d8dee6; }
  #vRuler { width: 20px; border-right: 1px solid #d8dee6; }
  .ruler-line { position: absolute; background: #9aa6b4; }
  .ruler-text { position: absolute; font-size: 9px; color: #667; }
  #stage { display: inline-block; }
  #props label { display: block; margin: 6px 0; color: #444; }
  #props label span { display: inline-block; width: 76px; }
  #props input, #props select { width: 120px; }
  #props .group { border: 1px solid #e3e8ee; border-radius: 4px; padding: 6px 8px; margin: 8px 0; }
  #props .group h4 { font-size: 12px; color: #555; margin-bottom: 4px; }
  #emptyProps { color: #999; font-size: 12px; }
  footer { background: #fff; border-top: 1px solid #d8dee6; padding: 6px 10px; height: 120px; display: flex; flex-direction: column; }
  #statusbar-top { display: flex; align-items: center; gap: 10px; }
  #statusText { font-weight: bold; color: #0a7; }
  #logBox { flex: 1; overflow-y: auto; font-family: Consolas, monospace; font-size: 11px; background: #fafbfc; border: 1px solid #e3e8ee; border-radius: 3px; margin-top: 4px; padding: 3px 6px; }
  #logBox div { white-space: pre-wrap; }
  #previewPanel { position: fixed; right: 24px; bottom: 140px; background: #fff; border: 1px solid #c4ccd6; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 8px; display: none; z-index: 10; }
  #previewPanel img { max-width: 380px; max-height: 420px; display: block; }
  #previewPanel button { margin-top: 6px; }
  #tooltip { position: absolute; background: rgba(0,0,0,.75); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px; pointer-events: none; display: none; z-index: 20; }
</style>
</head>
<body>
<header>
  <input id="serverUrl" value="http://127.0.0.1:53960" title="WinHost 地址">
  <button id="connectBtn">连接</button>
  <span id="connStatus">未连接</span>
  <select id="templateList" title="已有模板"></select>
  <button id="loadBtn">加载</button>
  <button id="newBtn">新建</button>
  <input id="nameInput" placeholder="模板名" value="web-demo">
  <label>宽 <input id="widthInput" type="number" value="100"></label>
  <label>高 <input id="heightInput" type="number" value="60"></label>
  <label>缩放 <span id="zoomLabel">100%</span></label>
  <label><input id="gridCheck" type="checkbox" checked> 网格</label>
  <button id="saveBtn" class="primary">保存</button>
  <button id="previewBtn">预览</button>
</header>
<main>
  <aside id="left">
    <h3>控件栏（点击后在画布点击放置 / 拖入画布）</h3>
    <div class="palette">
      <button data-type="Text">文本</button>
      <button data-type="Barcode">条码</button>
      <button data-type="QrCode">二维码</button>
      <button data-type="Image">图片</button>
      <button data-type="Line">线</button>
      <button data-type="Region" class="region">容器</button>
    </div>
    <h3>契约字段 <small>（自动推导）</small></h3>
    <ul id="fieldList"><li style="color:#999">暂无字段</li></ul>
    <h3>操作提示</h3>
    <ul style="font-size:11px;color:#777;list-style:none;line-height:1.7">
      <li>左键：选中 / 拖拽移动</li>
      <li>手柄：拖角缩放</li>
      <li>Shift+点击：多选</li>
      <li>Delete：删除选中</li>
      <li>中键拖拽：平移画布</li>
      <li>Ctrl+滚轮：缩放画布</li>
      <li>元素拖入容器自动居中</li>
    </ul>
  </aside>
  <section id="center">
    <div id="canvasWrap">
      <div id="stageBox">
        <div id="hRuler"></div>
        <div style="display:flex">
          <div id="vRuler"></div>
          <div id="stage"></div>
        </div>
      </div>
    </div>
  </section>
  <aside id="right">
    <h3>属性面板</h3>
    <div id="props"><div id="emptyProps">在画布上选中元素后显示属性。</div></div>
  </aside>
</main>
<footer>
  <div id="statusbar-top">
    <span id="statusText">就绪</span>
    <span id="paperInfo"></span>
    <button id="clearLogBtn" style="margin-left:auto">清空日志</button>
  </div>
  <div id="logBox"></div>
</footer>
<div id="previewPanel"><img id="previewImg" alt="预览"><button id="closePreviewBtn">关闭预览</button></div>
<div id="tooltip"></div>
<script src="konva.min.js"></script>
<script src="app.js"></script>
</body>
</html>
